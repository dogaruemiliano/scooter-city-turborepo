name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        # Dedicated test databases are provisioned by the shared E2E runner.
        # CI uses its own server; local tests use the Compose test profile.
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.17.0

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check-types

      - name: Unit tests
        run: pnpm test

      - name: Web production build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.ci.placeholder.invalid' }}
        run: pnpm --filter web build

      - name: Prepare databases and run E2E tests
        env:
          E2E_DATABASE_URL: postgresql://app:app@localhost:5434/scooter_city_test
          E2E_FINANCE_DATABASE_URL: postgresql://app:app@localhost:5434/finance_books_test
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET || 'ci-test-access-secret-padded-to-32-chars' }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'ci-test-refresh-secret-padded-to-32-chars' }}
          REFRESH_TOKEN_HMAC_SECRET: ${{ secrets.REFRESH_TOKEN_HMAC_SECRET || 'ci-test-refresh-hmac-padded-to-32-chars-x' }}
          OTP_HMAC_SECRET: ${{ secrets.OTP_HMAC_SECRET || 'ci-test-otp-hmac-padded-to-32-chars-pad-x' }}
          NODE_ENV: test
        run: pnpm test:e2e
