name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.ci.placeholder.invalid' }}

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Finish every check so one failure doesn't hide failures in other jobs.
      fail-fast: false
      matrix:
        include:
          - id: lint
            name: Lint
            command: pnpm lint
          - id: types
            name: Typecheck
            command: pnpm check-types
          - id: unit
            name: API and shared unit tests
            command: pnpm exec turbo run test --filter='!web'
          - id: web-unit-1
            name: Web unit tests (1/2)
            command: pnpm exec turbo run test --filter=web -- --shard=1/2
          - id: web-unit-2
            name: Web unit tests (2/2)
            command: pnpm exec turbo run test --filter=web -- --shard=2/2
          - id: web-build
            name: Web production build
            command: pnpm exec turbo run build --filter=web

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/verify
        with:
          command: ${{ matrix.command }}
          cache-key: ${{ matrix.id }}

  e2e:
    name: Database E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        # Dedicated test databases are provisioned by the shared E2E runner.
        # CI uses its own server; local tests use the Compose test profile.
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/verify
        with:
          command: pnpm test:e2e
          cache-key: e2e
        env:
          E2E_DATABASE_URL: postgresql://app:app@localhost:5434/scooter_city_test
          E2E_FINANCE_DATABASE_URL: postgresql://app:app@localhost:5434/finance_books_test
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET || 'ci-test-access-secret-padded-to-32-chars' }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'ci-test-refresh-secret-padded-to-32-chars' }}
          REFRESH_TOKEN_HMAC_SECRET: ${{ secrets.REFRESH_TOKEN_HMAC_SECRET || 'ci-test-refresh-hmac-padded-to-32-chars-x' }}
          OTP_HMAC_SECRET: ${{ secrets.OTP_HMAC_SECRET || 'ci-test-otp-hmac-padded-to-32-chars-pad-x' }}

  # Preserve the existing required check name for branch protection.
  ci:
    name: Lint · typecheck · test
    if: ${{ always() }}
    needs: [checks, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every verification job to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: test "$CHECKS_RESULT" = success && test "$E2E_RESULT" = success
