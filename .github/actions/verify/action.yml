name: Verify workspace
description: Install the pinned toolchain and run a check with persistent task caches.

inputs:
  command:
    description: Verification command to run from the workspace root.
    required: true
  cache-key:
    description: Separate cache namespace for each check and test shard.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24.17.0

    - uses: pnpm/action-setup@v6
      with:
        cache: true

    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Restore task and compiler caches
      id: cache
      uses: actions/cache/restore@v5
      with:
        path: |
          .turbo/cache
          apps/web/.next/cache
        key: ${{ runner.os }}-node24-verify-v1-${{ inputs.cache-key }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ runner.os }}-node24-verify-v1-${{ inputs.cache-key }}-${{ hashFiles('pnpm-lock.yaml') }}-

    - name: Verify
      shell: bash
      run: ${{ inputs.command }}

    # Turbo only stores successful tasks. Retain those even if a later task fails
    # so fixing a failure doesn't require repeating all the successful work.
    - name: Save task and compiler caches
      if: ${{ !cancelled() && steps.cache.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: |
          .turbo/cache
          apps/web/.next/cache
        key: ${{ steps.cache.outputs.cache-primary-key }}
