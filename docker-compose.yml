services:
  postgres:
    image: postgres:17-alpine
    container_name: scooter-city-turborepo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    # 5434 (not 5432) so this template can coexist with any host-installed
    # Postgres on the default port, and with other dev databases on 5433.
    # Adjust to taste; update DATABASE_URL to match.
    ports:
      - "5434:5432"
    volumes:
      - pgdata17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Explicitly opt in with: docker compose --profile test up -d postgres-test
  # No application volume is mounted. Tests can recreate all data after restart.
  postgres-test:
    profiles: [test]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "127.0.0.1:55434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata17:
